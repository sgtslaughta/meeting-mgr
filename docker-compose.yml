# Any OpenAI-compatible endpoint -- hosted API or a local server you run
# yourself (see the optional `whisper`/`ollama` services below). No default:
# api/worker never assume a local model is running.
x-asr-llm-env: &asr_llm_env
  ASR_BASE_URL: "${ASR_BASE_URL:?ASR_BASE_URL is required (any OpenAI-compatible ASR endpoint)}"
  ASR_API_KEY: "${ASR_API_KEY:?ASR_API_KEY is required (use \"unused\" for endpoints that ignore it)}"
  ASR_MODEL: "${ASR_MODEL:?ASR_MODEL is required}"
  LLM_BASE_URL: "${LLM_BASE_URL:?LLM_BASE_URL is required (any OpenAI-compatible chat endpoint)}"
  LLM_API_KEY: "${LLM_API_KEY:?LLM_API_KEY is required (use \"unused\" for endpoints that ignore it)}"
  LLM_MODEL: "${LLM_MODEL:?LLM_MODEL is required}"

services:
  postgres:
    image: postgres:17
    environment: { POSTGRES_PASSWORD: meeting, POSTGRES_DB: meeting_mgr }
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      retries: 20
  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]   # durability: jobs are hours of GPU work
    volumes: ["redisdata:/data"]
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: meeting, MINIO_ROOT_PASSWORD: meetingmeeting }
    volumes: ["miniodata:/data"]
    ports: ["9000:9000", "9001:9001"]

  # One-shot. api and worker wait for it to exit 0, so a fresh stack never
  # serves against an empty schema, and two replicas cannot race two migrations.
  migrate:
    build: .
    command: alembic upgrade head
    environment: &app_env
      DATABASE_URL: postgresql+psycopg://postgres:meeting@postgres:5432/meeting_mgr
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: meeting
      S3_SECRET_KEY: meetingmeeting
      S3_BUCKET: recordings
      DIARIZER_URL: http://diarizer:8081
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    build: .
    command: uvicorn meeting_mgr.api.main:app --host 0.0.0.0 --port 8000
    environment:
      <<: [*app_env, *asr_llm_env]
      # Least-privilege role RLS policies apply to; used by
      # get_org_session/get_readonly_org_session. The migrate service still
      # runs DDL as the superuser DATABASE_URL above -- it is what creates
      # this role and its policies, so it cannot connect as it.
      DATABASE_URL_APP: postgresql+psycopg://meeting_app:meeting_app@postgres:5432/meeting_mgr
      SESSION_SECRET: "${SESSION_SECRET:?SESSION_SECRET is required}"
      # Comma-separated source IPs of reverse proxies allowed to set the
      # x-ssl-client-subject header. Empty (the default) means mTLS identity
      # is never trusted from anywhere -- see auth/mtls.py.
      MTLS_PROXY_ALLOWLIST_RAW: "${MTLS_PROXY_ALLOWLIST:-}"
      OIDC_DISCOVERY_URL: "${OIDC_DISCOVERY_URL:-}"
      OIDC_CLIENT_ID: "${OIDC_CLIENT_ID:-}"
      OIDC_CLIENT_SECRET: "${OIDC_CLIENT_SECRET:-}"
    ports: ["8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_started }
      minio: { condition: service_started }
  worker:
    build: .
    # -I: celery_app's include=[...] (app.py) already registers
    # orchestrate.py/edits.py, so this is redundant but kept as
    # belt-and-braces.
    command: celery -A meeting_mgr.pipeline.app worker -l info
      -I meeting_mgr.pipeline.orchestrate,meeting_mgr.api.edits
    environment:
      <<: [*app_env, *asr_llm_env]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_started }
      minio: { condition: service_started }
  beat:
    build: .
    # Runs the schedule registered in pipeline/app.py's beat_schedule
    # (currently just sweep-retention-daily). A separate process from
    # `worker` -- beat only enqueues tasks on schedule, it does not execute
    # them; `worker` still does the actual purge_organization/sweep_retention
    # task bodies, same as every other queued task.
    command: celery -A meeting_mgr.pipeline.app beat -l info
    environment: *app_env
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_started }
  diarizer:
    build: ./services/diarizer
    environment: { HF_TOKEN: "${HF_TOKEN:?HF_TOKEN is required for pyannote}" }
    ports: ["8081:8081"]
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }]

  # Optional local-model dev convenience -- NOT started by a plain `docker
  # compose up`. api/worker/beat never assume these exist; ASR_BASE_URL /
  # LLM_BASE_URL point wherever the operator configures (any OpenAI-
  # compatible endpoint, local or hosted). Opt in with
  # `docker compose --profile local-models up`.
  whisper:
    profiles: ["local-models"]
    image: ghcr.io/speaches-ai/speaches:latest-cuda-12.6.3
    volumes: ["whisper_cache:/home/ubuntu/.cache/huggingface"]
    ports: ["8080:8000"]
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }]

  # LLM_MODEL default expects `docker compose exec ollama ollama pull qwen3:32b`
  # run once. Same opt-in profile as `whisper` above.
  ollama:
    profiles: ["local-models"]
    image: ollama/ollama
    volumes: ["ollama_data:/root/.ollama"]
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }]

  web:
    build: ./web
    ports: ["5173:80"]
    depends_on:
      api: { condition: service_started }

volumes: { pgdata: {}, redisdata: {}, miniodata: {}, whisper_cache: {}, ollama_data: {} }
