services:
  postgres:
    image: postgres:17
    environment: { POSTGRES_PASSWORD: meeting, POSTGRES_DB: meeting_mgr }
    volumes: ["pgdata:/var/lib/postgresql/data"]
  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]   # durability: jobs are hours of GPU work
    volumes: ["redisdata:/data"]
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: meeting, MINIO_ROOT_PASSWORD: meetingmeeting }
    volumes: ["miniodata:/data"]
    ports: ["9000:9000", "9001:9001"]
  api:
    build: .
    command: uvicorn meeting_mgr.api.main:app --host 0.0.0.0 --port 8000
    env_file: [.env]
    ports: ["8000:8000"]
    depends_on: [postgres, redis, minio]
  worker:
    build: .
    command: celery -A meeting_mgr.pipeline.app worker -l info
    env_file: [.env]
    depends_on: [postgres, redis, minio]
  diarizer:
    build: ./services/diarizer
    environment: { HF_TOKEN: "${HF_TOKEN}" }
    ports: ["8081:8081"]
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }]

volumes: { pgdata: {}, redisdata: {}, miniodata: {} }
