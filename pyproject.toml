[project]
name = "meeting-mgr"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "celery[redis]>=5.4",
  "boto3>=1.35",
  "httpx>=0.27",
  "python-multipart>=0.0.12",
  "redis>=6.4.0",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meeting_mgr"]

[tool.ruff]
target-version = "py312"
line-length = 100
# Alembic-generated migration files: boilerplate from `alembic revision
# --autogenerate`, not hand-maintained. Linting/reformatting them is
# busywork with no benefit and risks disturbing generated DDL.
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
# E/F: pycodestyle errors + pyflakes (correctness). I: import sorting.
# UP: pyupgrade (modern syntax). B: bugbear (common bug patterns).
select = ["E", "F", "I", "UP", "B"]
ignore = [
  # B008: FastAPI's Depends()/Query() default-arg pattern triggers this;
  # it's the documented, correct way to use FastAPI, not a bug.
  "B008",
  # E702: the codebase has an established local style of pairing a single
  # related statement on one line (e.g. `s.add(m); s.flush()`) in tests,
  # used 37x across the suite. Not worth a sweeping reformat commit to ban.
  "E702",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]
