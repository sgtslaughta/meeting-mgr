[project]
name = "diarizer"
version = "0.1.0"
requires-python = "==3.12.*"
description = "Speaker diarization microservice (separate container; ML deps isolated from the main package)."
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "python-multipart>=0.0.12",
  "pyannote.audio>=3.1",
  "torch>=2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
