name: docs

on:
  push:
    branches: [main]
    paths:
      - "zensical.toml"
      - "docs/**"
      - ".github/workflows/docs.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # enablement: true turns Pages on via the API if it is not already
      # configured, so a fresh fork or clone does not need a manual visit to
      # repo settings before the first docs deploy succeeds. Without it the
      # step fails with "Get Pages site failed ... Not Found".
      - uses: actions/configure-pages@v6
        with:
          enablement: true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install zensical
        run: pip install zensical

      - name: Build docs (strict)
        run: zensical build --strict

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
