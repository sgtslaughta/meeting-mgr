name: quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: meeting_mgr_test
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["56379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # minio is deliberately NOT a service container. Its image CMD is
      # ["minio"] with no subcommand, and `services:` cannot override CMD --
      # the container prints usage and exits immediately, so the health check
      # never passes. Verified by running the bare image: it exits at once.
      # It is started as a step below with the `server /data` command instead.
    steps:
      - uses: actions/checkout@v4

      - name: Start minio
        run: |
          docker run -d --name minio \
            -p 59000:9000 \
            -e MINIO_ROOT_USER=test \
            -e MINIO_ROOT_PASSWORD=testtest \
            --health-cmd "mc ready local || exit 1" \
            --health-interval 5s --health-timeout 5s --health-retries 20 \
            minio/minio server /data
          # Wait for it to actually accept connections rather than assuming.
          for i in $(seq 1 30); do
            if curl -sf http://localhost:59000/minio/health/live; then
              echo "minio ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "minio failed to become ready"; docker logs minio; exit 1

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.28"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked

      - name: Run migrations
        run: uv run alembic upgrade head

      - name: Run tests (1st pass)
        run: uv run pytest -q

      # The suite shares a persistent Postgres with no per-test cleanup
      # fixture, so a test leaving orphan rows only fails on rerun. Run
      # twice against the same database to catch that class of bug.
      - name: Run tests (2nd pass, same database)
        run: uv run pytest -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.28"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npx vitest run

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

# No Playwright/e2e job here: tests/e2e needs the full stack including a
# diarizer that requires an HF_TOKEN this CI does not have. E2E coverage
# stays manual/local until that's solved.
