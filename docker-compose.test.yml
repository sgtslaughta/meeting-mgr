# Explicit project name -- without this it defaults to the directory name
# ("meeting_mgr"), same as docker-compose.yml, and running both against the
# same project silently tears down/recreates each other's containers.
name: meeting_mgr_test

services:
  postgres:
    image: postgres:17
    environment: { POSTGRES_PASSWORD: test, POSTGRES_DB: meeting_mgr_test }
    ports: ["55432:5432"]
  redis:
    image: redis:7
    ports: ["56379:6379"]
  minio:
    image: minio/minio
    command: server /data
    environment: { MINIO_ROOT_USER: test, MINIO_ROOT_PASSWORD: testtest }
    ports: ["59000:9000"]
