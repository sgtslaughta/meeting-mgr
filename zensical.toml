[project]

site_name = "Meeting-MGR"
site_description = "A self-hosted meeting records keeper — documentation."
site_author = "sgtslaughta"

nav = [
  { "Home" = "index.md" },
  { "User guide" = "user-guide.md" },
  { "Security status" = "security.md" },
  { "Admin guide" = [
      { "Overview" = "admin-guide.md" },
      { "Ingest paths" = "ingest.md" },
      { "Retention and purge" = "retention.md" },
  ] },
  { "Architecture Decision Records" = [
      { "ADR-0001: Inference is HTTP, not a library" = "adr/0001-inference-over-http.md" },
      { "ADR-0002: Diarization as an owned service" = "adr/0002-diarization-as-owned-service.md" },
      { "ADR-0003: Provenance and citations" = "adr/0003-provenance-and-citations.md" },
  ] },
  { "Agent docs" = [
      { "Domain docs" = "agents/domain.md" },
      { "Issue tracker" = "agents/issue-tracker.md" },
      { "Triage labels" = "agents/triage-labels.md" },
  ] },
]

[project.theme]

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

features = [
    "content.code.copy",
    "navigation.footer",
    "navigation.indexes",
    "navigation.sections",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
]

[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
